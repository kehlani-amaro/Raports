name: Build Desktop App

on:
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./raport-desk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './raport-desk/package-lock.json'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Web Assets
        run: npx vite build

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: './raport-desk'
          tagName: v1.0.0
          releaseName: 'RaportDesk v1.0.0'
          releaseBody: 'Автономна збірка RaportDesk для Windows (x64)'
          releaseDraft: false
          prerelease: false
